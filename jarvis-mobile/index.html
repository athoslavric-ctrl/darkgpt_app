<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<!-- viewport blocat: fără zoom accidental, viewport-fit=cover pentru notch -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="JARVIS MOBILE — telecomanda de telefon pentru sistemul de trading">
<title>JARVIS MOBILE</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- singura dependență externă permisă: fonturile Google -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== HEADER compact (sticky sus) ===== -->
<header class="app-header">
  <div class="brand">
    <h1>J.A.R.V.I.S<span>.</span></h1>
    <div class="sub">Mobile Command</div>
  </div>
  <div class="sys">
    <span class="val"><span class="pulse-dot"></span> ONLINE</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</header>

<!-- ===== CONȚINUT: 4 ecrane, unul singur vizibil ===== -->
<main class="screens">

  <!-- ── ECRAN 1: NUCLEU ─────────────────────────────── -->
  <section class="screen active" id="screen-core">
    <!-- reactorul animat, versiune compactă -->
    <div class="reactor" aria-hidden="true">
      <div class="ring r1"></div><div class="ring r2"></div>
      <div class="ring r3"></div><div class="ring r4"></div>
      <div class="core-c"><span>JARVIS</span></div>
    </div>

    <div class="voice-line">
      <div class="eq"><i></i><i></i><i></i><i></i><i></i></div>
      <span class="voice-status">VORBEȘTE…</span>
    </div>

    <!-- replica scrisă literă cu literă -->
    <div class="speech">
      <span class="who">◈ JARVIS</span>
      <span class="txt" id="speech"></span>
    </div>

    <!-- ultimul semnal activ (populat din data.js) -->
    <div class="active-signal panel" id="activeSignal"></div>

    <!-- butoane mari, min 56px înălțime -->
    <div class="actions">
      <button class="btn ok" id="btnConfirm">✓ CONFIRMĂ</button>
      <button class="btn no" id="btnReject">✕ ANULEAZĂ</button>
    </div>
  </section>

  <!-- ── ECRAN 2: SEMNALE ────────────────────────────── -->
  <section class="screen" id="screen-signals">
    <h2 class="screen-title">Flux Semnale · Analiză Claude</h2>
    <div class="feed" id="feed"></div>
  </section>

  <!-- ── ECRAN 3: POZIȚII ────────────────────────────── -->
  <section class="screen" id="screen-positions">
    <h2 class="screen-title">Poziții & Performanță</h2>
    <div class="pos-list" id="posList"></div>
    <div class="stats" id="stats"></div>
  </section>

  <!-- ── ECRAN 4: GRAFIC ─────────────────────────────── -->
  <section class="screen" id="screen-chart">
    <h2 class="screen-title">Grafic Live — Semnal Activ</h2>
    <div class="chart-meta">
      <span class="pair" id="chartPair">ETH / USDT</span>
      <span class="price" id="px">—</span>
      <span class="chg" id="chg"></span>
    </div>
    <canvas id="chart"></canvas>
    <div class="levels" id="levels"></div>
  </section>

</main>

<!-- ===== banner demo ===== -->
<div class="demo-banner">MOD DEMO — date simulate · Paper trading</div>

<!-- ===== TAB BAR (navigare jos, ca o aplicație nativă) ===== -->
<nav class="tabbar">
  <button class="tab active" data-screen="screen-core">
    <span class="ico">◈</span><span class="lbl">NUCLEU</span>
  </button>
  <button class="tab" data-screen="screen-signals">
    <span class="ico">⚡</span><span class="lbl">SEMNALE</span><span class="dot"></span>
  </button>
  <button class="tab" data-screen="screen-positions">
    <span class="ico">▤</span><span class="lbl">POZIȚII</span>
  </button>
  <button class="tab" data-screen="screen-chart">
    <span class="ico">∿</span><span class="lbl">GRAFIC</span>
  </button>
</nav>

<!-- data.js = singura sursă de date; app.js = UI -->
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
// Înregistrăm service worker-ul pentru funcționare offline (PWA)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js');
  });
}
</script>
</body>
</html>
